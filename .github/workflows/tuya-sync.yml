name: Sync Tuya Boiler

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: tuya-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      TUYA_ACCESS_ID: ${{ secrets.TUYA_ACCESS_ID }}
      TUYA_ACCESS_SECRET: ${{ secrets.TUYA_ACCESS_SECRET }}
      TUYA_DEVICE_ID: 20415515a4e57cabb4b8
      TUYA_ENDPOINT: https://openapi.tuyaeu.com
      TUYA_SYNC_OPTIONAL: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-tuya.txt

      - name: Check credentials
        id: creds
        shell: bash
        run: |
          if [[ -n "$TUYA_ACCESS_ID" && -n "$TUYA_ACCESS_SECRET" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Tuya secrets not configured yet; skipping sync."
          fi

      - name: Install dependencies
        if: steps.creds.outputs.available == 'true'
        run: pip install -r scripts/requirements-tuya.txt

      - name: Sync Tuya data
        if: steps.creds.outputs.available == 'true'
        run: python scripts/tuya_sync.py

      - name: Commit updated snapshots
        if: steps.creds.outputs.available == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tuya
          if git diff --cached --quiet; then
            echo "No Tuya data changes to commit."
            exit 0
          fi
          git commit -m "Update Tuya boiler data"
          git push
